# COST NOTICE: manual only; FIVE independent 1,000,000-step CPU trainings.
# Do not use a 260-step CI smoke run to claim locomotion performance.
name: Ant-v5 five-seed publication candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ant-v5-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    name: SAC Ant-v5 seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Train one independent SAC policy (1 million steps)
        env:
          MUJOCO_RL_OUTPUT_ROOT: ${{ github.workspace }}/runs/ant-v5-official/seed-${{ matrix.seed }}
          OMP_NUM_THREADS: '1'
        run: |
          python -m src.check_env --steps 5
          python -m src.train --steps 1000000 --seed ${{ matrix.seed }} --device cpu --eval-freq 25000 --checkpoint-freq 200000
          python -m src.evaluate --episodes 10 --seed 1000
          python -m src.verify --require-evaluation > audit.json
      - name: Package evaluated policy and provenance
        shell: bash
        run: |
          set -euo pipefail
          RUN="runs/ant-v5-official/seed-${{ matrix.seed }}"
          mkdir -p evidence
          cp "$RUN/logs/evaluation.json" evidence/evaluation.json
          cp "$RUN/models/experiment.json" evidence/experiment.json
          cp audit.json evidence/audit.json
          cp "$RUN/models/best/best_model.zip" evidence/policy.zip
          python -m pip freeze > evidence/requirements-resolved.txt
          python -m src.evidence evidence
      - uses: actions/upload-artifact@v7
        with:
          name: ant-v5-seed-${{ matrix.seed }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Audit five seeds and publish scorecard artifact
    needs: [train]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: ant-v5-seed-*
          path: evidence/
      - name: Verify bundle authenticity boundaries and aggregate statistics
        shell: bash
        run: |
          set -euo pipefail
          python -m src.evidence evidence/ant-v5-seed-{0,1,2,3,4} > evidence/verification.json
          python -m src.benchmark evidence/ant-v5-seed-*/evaluation.json --publication --min-seeds 5 --output evidence/benchmark.json
          python -m src.scorecard evidence/benchmark.json --output evidence/SCORECARD.md
      - uses: actions/upload-artifact@v7
        with:
          name: ant-v5-publication-evidence
          path: |
            evidence/benchmark.json
            evidence/verification.json
            evidence/SCORECARD.md
          if-no-files-found: error
          retention-days: 90
