name: Cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q src tests
      - name: Run contract and failure-injection tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test Ant-v5 physics
        run: python -m src.check_env --steps 32
      - name: SAC training and snapshot-resume integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m src.train --steps 260 --eval-freq 260 --checkpoint-freq 260
          python -m src.train --steps 4 --resume --eval-freq 4 --checkpoint-freq 4
          python -m src.evaluate --episodes 1
          test -s models/latest.json
          test -s logs/evaluation.json
      - name: Run Bash syntax checks
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n run.sh setup.sh watch.sh test.sh
